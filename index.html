<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101e34"><meta name="description" content="Explore the KGEL Christmas 2026 product catalog. Turn pages, search products, and zoom in on the details."><title>KGEL | Christmas Catalog 2026</title><link rel="stylesheet" href="vendor/tailwind.min.css"><link rel="stylesheet" href="style.css"><script defer src="vendor/page-flip.js"></script><script defer src="app.js"></script></head>
<body><header class="flex items-center justify-between"><a class="brand" href="./" aria-label="KGEL catalog home">KGEL</a><form id="searchForm" role="search"><label class="sr-only" for="search">Search product or page number</label><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find a product or page…" autocomplete="off"><kbd>↵</kbd><div id="results" hidden></div></form><div class="flex items-center gap-2 header-actions"><div class="zoom-controls"><button id="zoomOut" aria-label="Zoom out">−</button><output id="zoomLabel">100%</output><button id="zoomIn" aria-label="Zoom in">+</button></div><button id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen">⛶</button></div></header>
<main><section class="reader" aria-label="Interactive product catalog"><div id="viewport"><button id="sidePrev" class="side-arrow side-prev" aria-label="Turn to previous spread">‹</button><button id="sideNext" class="side-arrow side-next" aria-label="Turn to next spread">›</button><div id="bookHost"><div id="book"></div></div><p id="loading" role="status">Preparing your catalog…</p></div><div class="reader-bottom flex items-center justify-between"><span class="hint">↔ &nbsp; Drag a corner or click to turn</span><nav class="flex items-center gap-4" aria-label="Catalog pages"><button id="prev" aria-label="Previous page">←</button><output id="pageLabel" aria-live="polite">Loading</output><button id="next" aria-label="Next page">→</button></nav><button id="toggleThumbs" aria-expanded="false" aria-controls="thumbnails">▦ &nbsp; All pages</button></div></section><div class="progress-row flex items-center gap-4"><span>01</span><label class="sr-only" for="slider">Go to page</label><input id="slider" type="range" min="1" max="1" value="1"><span id="total">—</span></div><div id="thumbnails" hidden aria-label="Page thumbnails"></div><footer class="flex justify-between"><span>KGEL <span class="footer-divider">/</span> Christmas Catalog 2026</span><span>Made for discovery. Designed for you.</span></footer><p id="notice" role="status" aria-live="polite"></p></main><dialog id="detail"><div class="detail-bar"><span>PAGE DETAIL · Scroll to explore</span><div><button id="detailMinus" aria-label="Reduce detail zoom">−</button><button id="detailPlus" aria-label="Increase detail zoom">+</button><button id="closeDetail" aria-label="Close zoom view">✕</button></div></div><div id="detailScroll"><img id="detailImage" alt=""></div></dialog></body></html>
